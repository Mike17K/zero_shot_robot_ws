# workcell_demo pick_place_demo parameters (see pick_place_demo.py).
/**:
  ros__parameters:
    robot_namespace: "robot_1"
    line_namespace: "conveyor_package_infeed"
    # Pose-graph nodes (navigator_cli config/pose_graph.json) - ids or labels.
    pick_node: "6"                  # above the box waiting at the beam
    place_nodes: ["2", "3", "4"]    # ConvaiorLeft / ConvaiorMiddle / ConvaiorRight
    place_order: "round_robin"      # or "random"
    home_node: "5"                  # InspectionPoint - idle pose
    approach_max_distance: 0.30     # m, straight down until the force pad touches - at most this far
    approach_speed: 0.015           # m/s, guarded move down to the box (slow: the stop on contact is a trajectory cancel)
    contact_force: 5.0              # N, force change on the gripper pad that counts as contact
    lift_distance: 0.30             # m, straight up with the box after the grasp
    lift_speed: 0.05                # m/s
    grasp_wait_sec: 3.0             # wall time for gripper_manager to report the grasp
    start_enabled: true
    go_home_on_start: true
