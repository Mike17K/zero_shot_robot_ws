# joint_limits.yaml allows the dynamics properties specified in the URDF to be overwritten or augmented as needed

# For beginners, we downscale velocity and acceleration limits.
# You can always specify higher scaling factors (<= 1.0) in your motion requests.
# Increase the values below to 1.0 to always move at maximum speed.
default_velocity_scaling_factor: 1.0
default_acceleration_scaling_factor: 1.0

# Specific joint properties can be changed with the keys [max_position, min_position, max_velocity, max_acceleration]
# Joint limits can be turned off with [has_velocity_limits, has_acceleration_limits]
#
# Position/velocity below mirror motoman_gp70l_support/urdf/gp70l_macro.xacro's
# own <limit> values (MOTOMAN-GP70L INSTRUCTIONS HW2480667 rev 1), converted to
# radians. Acceleration has no URDF equivalent - these are an approximate
# max_velocity*1.5 (full speed in ~0.67s) default, not a vendor-specified
# number; tune down if motion looks unrealistically snappy in sim.
joint_limits:
  # --- Yaskawa Motoman GP70L Joints (Converted to Radians) ---
  gp_joint_1:
    has_position_limits: true
    min_position: -3.141593 # -180 deg
    max_position: 3.141593 # 180 deg
    has_velocity_limits: true
    max_velocity: 3.141593 # 180 deg/s
    has_acceleration_limits: true
    max_acceleration: 4.7124

  gp_joint_2:
    has_position_limits: true
    min_position: -1.570796 # -90 deg
    max_position: 2.705260 # 155 deg
    has_velocity_limits: true
    max_velocity: 2.146755 # 123 deg/s
    has_acceleration_limits: true
    max_acceleration: 3.2201

  gp_joint_3:
    has_position_limits: true
    min_position: -1.396263 # -80 deg
    max_position: 1.570796 # 90 deg
    has_velocity_limits: true
    max_velocity: 2.792527 # 160 deg/s
    has_acceleration_limits: true
    max_acceleration: 4.1888

  gp_joint_4:
    has_position_limits: true
    min_position: -6.283185 # -360 deg
    max_position: 6.283185 # 360 deg
    has_velocity_limits: true
    max_velocity: 4.014257 # 230 deg/s
    has_acceleration_limits: true
    max_acceleration: 6.0214

  gp_joint_5:
    has_position_limits: true
    min_position: -2.181662 # -125 deg
    max_position: 2.181662 # 125 deg
    has_velocity_limits: true
    max_velocity: 4.014257 # 230 deg/s
    has_acceleration_limits: true
    max_acceleration: 6.0214

  gp_joint_6:
    has_position_limits: true
    min_position: -6.283185 # -360 deg
    max_position: 6.283185 # 360 deg
    has_velocity_limits: true
    max_velocity: 6.108652 # 350 deg/s
    has_acceleration_limits: true
    max_acceleration: 9.163
