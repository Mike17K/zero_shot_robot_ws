# src/robots/group_a/group_a_bringup/config/gz_bridge.yaml

# ── Orbbec camera ──────────────────────────────────────────────────────────────
# - ros_topic_name: "/$(var namespace)/camera/depth/points"
#   gz_topic_name: "/$(var namespace)/camera/depth/points"
#   ros_type_name: "sensor_msgs/msg/PointCloud2"
#   gz_type_name: "gz.msgs.PointCloud2"
#   direction: GZ_TO_ROS

- ros_topic_name: "/$(var namespace)/camera/depth"
  gz_topic_name: "/$(var namespace)/camera/depth"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/$(var namespace)/camera/color"
  gz_topic_name: "/$(var namespace)/camera/color"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/$(var namespace)/camera/camera_info"
  gz_topic_name: "/$(var namespace)/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# ── Gripper force pad (force_torque sensor, group_a_macro.xacro) ──────────────
# Raw: force_sensor.py re-stamps it (frame_id gripper_force_sensor_link) onto
# /<ns>/gripper/wrench and derives /<ns>/gripper/contact.
- ros_topic_name: "/$(var namespace)/gripper/force_torque_raw"
  gz_topic_name: "/$(var namespace)/gripper/force_torque_raw"
  ros_type_name: "geometry_msgs/msg/WrenchStamped"
  gz_type_name: "gz.msgs.Wrench"
  direction: GZ_TO_ROS

# ── Odometry (from PosePublisher plugin) ───────────────────────────────────────

- ros_topic_name: "/$(var namespace)/pose"
  gz_topic_name: "/model/$(var namespace)/pose"
  ros_type_name: "geometry_msgs/msg/PoseArray"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
  
# ── Suction gripper ───────────────────────────────────────────────────────────
