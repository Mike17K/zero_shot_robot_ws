# src/robots/group_a/group_a_bringup/config/gz_bridge.yaml

# ── Orbbec camera ──────────────────────────────────────────────────────────────
# - ros_topic_name: "/$(var namespace)/camera/depth/points"
#   gz_topic_name: "/$(var namespace)/camera/depth/points"
#   ros_type_name: "sensor_msgs/msg/PointCloud2"
#   gz_type_name: "gz.msgs.PointCloud2"
#   direction: GZ_TO_ROS

- ros_topic_name: "/$(var namespace)/camera/depth"
  gz_topic_name: "/$(var namespace)/camera/depth"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/$(var namespace)/camera/color"
  gz_topic_name: "/$(var namespace)/camera/color"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/$(var namespace)/camera/camera_info"
  gz_topic_name: "/$(var namespace)/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# ── Odometry (from PosePublisher plugin) ───────────────────────────────────────

- ros_topic_name: "/$(var namespace)/pose"
  gz_topic_name: "/model/$(var namespace)/pose"
  ros_type_name: "geometry_msgs/msg/PoseArray"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# PosePublisher's tf output is deliberately NOT bridged into ROS (it used to
# be, straight onto the global "/tf" - removed). robot_state_publisher is
# this robot's own tf source (base_link -> {gp_*, camera_*}), scoped to
# /<namespace>/tf via bringup.launch.py's explicit remap; bridging
# PosePublisher's ground-truth pose data onto that same topic (or worse, onto
# the global /tf, as this used to) would be a second, conflicting source for
# the same frames. The /pose bridge above is unaffected (independent gz
# topic, ground-truth data still available for whoever wants it later) - same
# reasoning as agv_bringup/config/gz_bridge.yaml in the sibling
# internal_delivery_system_ws workspace.
